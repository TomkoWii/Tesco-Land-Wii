name: Build Tesco Land
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii libraries
        run: |
          if [ -d /opt/devkitpro/libogc ]; then
            echo "libogc already present"
          else
            for i in 1 2 3 4; do
              dkp-pacman -Sy --noconfirm wii-dev && break
              echo "retry $i"; sleep 10
            done
          fi
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p out/apps/tescoland
          cp boot.dol meta.xml icon.png out/apps/tescoland/
      - uses: actions/upload-artifact@v4
        with:
          name: tescoland
          path: out
