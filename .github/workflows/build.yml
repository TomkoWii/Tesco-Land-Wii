name: Build Tesco Land
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii libraries
        run: dkp-pacman -Syu --noconfirm wii-dev
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p out/apps/tescoland
          cp boot.dol meta.xml out/apps/tescoland/
      - uses: actions/upload-artifact@v4
        with:
          name: tescoland
          path: out
